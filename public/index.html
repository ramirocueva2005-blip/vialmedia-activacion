<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Registro de activación | Vialmedia</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--line:#2a313c;--tx:#f2f4f7;--mut:#9aa4b2;--ac:#c6f432;--err:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.04em;font-size:18px}.brand b{color:var(--ac)}
.tag{border:1px solid var(--ac);color:var(--ac);padding:4px 12px;border-radius:99px;font-weight:700;font-size:13px;letter-spacing:.08em}
h1{font-size:30px;line-height:1.1;margin:28px 0 8px}h1 em{color:var(--ac);font-style:normal}
p.sub{color:var(--mut);margin:0 0 24px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 6px}
input[type=text],input[type=tel],select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:22px;font-size:13px;color:var(--mut);line-height:1.4}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--ac);margin-top:1px}
button{width:100%;margin-top:24px;padding:16px;border:0;border-radius:12px;background:var(--ac);color:#0e1116;font-weight:800;font-size:16px;letter-spacing:.04em;cursor:pointer}
button:disabled{opacity:.5}
.msg{margin-top:14px;font-size:14px;min-height:20px;color:var(--err)}
.ok{text-align:center;padding:60px 0}.ok .big{font-size:56px;color:var(--ac)}.ok h2{margin:8px 0}
footer{margin-top:32px;font-size:11px;color:var(--mut);text-align:center}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">VIAL<b>MEDIA</b></div><div class="tag">UTPL</div></div>
<div id="form">
<h1>Decide <em>ser más</em></h1>
<p class="sub">Regístrate y descubre tu futuro universitario.</p>
<form id="f" novalidate>
<label for="n">Nombre y apellido</label>
<input id="n" type="text" autocomplete="name" maxlength="80" placeholder="Nombre y apellido">
<label for="t">Teléfono celular</label>
<input id="t" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="09XXXXXXXX">
<div class="hint">Número ecuatoriano de 10 dígitos que empieza con 09.</div>
<label for="c">Carrera de interés</label>
<select id="c"><option value="">Selecciona tu carrera</option></select>
<label class="chk"><input id="a" type="checkbox"><span>Autorizo el tratamiento de mis datos para que la UTPL pueda contactarme sobre mi interés académico.</span></label>
<button id="b" type="submit">REGISTRARME</button>
<div id="m" class="msg" role="alert"></div>
</form></div>
<div id="done" class="ok" hidden><div class="big">✓</div><h2>¡Registro exitoso!</h2><p class="sub">Pronto te contactarán.</p></div>
<footer>Activación operada por Vialmedia</footer>
</div>
<script>
const $=id=>document.getElementById(id);
fetch('/api/carreras').then(r=>r.json()).then(l=>l.forEach(x=>{const o=document.createElement('option');o.value=o.textContent=x;$('c').appendChild(o)}));
$('t').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,10));
$('f').addEventListener('submit',async e=>{
  e.preventDefault();const m=$('m');m.textContent='';
  const nombre=$('n').value.trim().replace(/\s+/g,' '),telefono=$('t').value,carrera=$('c').value,autorizacion=$('a').checked;
  if(nombre.length<3||!nombre.includes(' '))return m.textContent='Ingresa nombre y apellido.';
  if(!/^09\d{8}$/.test(telefono))return m.textContent='El teléfono debe tener 10 dígitos y empezar con 09.';
  if(!carrera)return m.textContent='Selecciona una carrera.';
  if(!autorizacion)return m.textContent='Debes autorizar el tratamiento de tus datos.';
  $('b').disabled=true;
  try{
    const r=await fetch('/api/registro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre,telefono,carrera,autorizacion})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||'Error al registrar.');
    $('form').hidden=true;$('done').hidden=false;
  }catch(err){m.textContent=err.message;$('b').disabled=false}
});
</script></body></html>
