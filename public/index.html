<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Decide ser más | UTPL</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1c4069;--navy2:#163354;--yel:#f2c142;--tx:#fff;--mut:#c4d0df;--err:#ffb4b4}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--tx);font-family:Montserrat,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:22px 20px calc(32px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:3px solid var(--yel)}
.logo{font-weight:900;font-size:44px;letter-spacing:-.01em;line-height:1}
.plus{width:34px;height:34px;position:relative}.plus:before,.plus:after{content:"";position:absolute;background:var(--yel);border-radius:2px}.plus:before{left:12px;top:0;width:10px;height:34px}.plus:after{top:12px;left:0;height:10px;width:34px}
h1{font-size:34px;line-height:1.05;margin:30px 0 10px;font-weight:900;text-transform:uppercase}h1 em{color:var(--yel);font-style:normal;text-transform:none}
p.sub{color:var(--mut);margin:0 0 22px;font-weight:500}
label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 6px}
input[type=text],input[type=tel],input[type=email],select{width:100%;padding:15px;border-radius:12px;border:0;background:#fff;color:#1c2b3d;font:600 16px Montserrat,system-ui,sans-serif}
input:focus,select:focus{outline:3px solid var(--yel);outline-offset:1px}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:22px;font-size:12px;color:var(--mut);line-height:1.45}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--yel);margin-top:1px}
button{width:100%;margin-top:24px;padding:17px;border:0;border-radius:12px;background:var(--yel);color:var(--navy2);font:900 16px Montserrat,sans-serif;letter-spacing:.06em;cursor:pointer}
button:disabled{opacity:.5}
.msg{margin-top:14px;font-size:14px;min-height:20px;color:var(--err);font-weight:600}
.ok{text-align:center;padding:60px 0}.ok .big{font-size:60px;color:var(--yel);font-weight:900}.ok h2{margin:8px 0;font-weight:900;text-transform:uppercase}
footer{margin-top:30px;font-size:11px;color:var(--mut);text-align:center}
</style></head><body><div class="wrap">
<div class="top"><div class="logo">UTPL</div><div class="plus"></div></div>
<div id="form">
<h1>Decide ser <em>más</em></h1>
<p class="sub">Regístrate y descubre tu futuro universitario.</p>
<form id="f" novalidate>
<label for="n">Nombres y apellidos</label>
<input id="n" type="text" autocomplete="name" maxlength="80" placeholder="Nombres y apellidos">
<label for="d">Número de cédula</label>
<input id="d" type="text" inputmode="numeric" maxlength="10" placeholder="10 dígitos">
<label for="e">Correo electrónico</label>
<input id="e" type="email" autocomplete="email" maxlength="100" placeholder="correo@ejemplo.com">
<label for="t">Número telefónico</label>
<input id="t" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="09XXXXXXXX">
<div class="hint">Número ecuatoriano de 10 dígitos que empieza con 09.</div>
<label for="m">Modalidad de interés</label>
<select id="m"><option value="">Selecciona la modalidad</option></select>
<label for="c" id="cl">Carrera o programa de interés</label>
<select id="c" disabled><option value="">Primero elige la modalidad</option></select>
<input id="cx" type="text" maxlength="100" placeholder="Escribe el programa de tu interés" hidden>
<label class="chk"><input id="a" type="checkbox"><span>Autorizo el tratamiento de mis datos personales para que la UTPL pueda contactarme sobre mi interés académico.</span></label>
<button id="b" type="submit">REGISTRARME</button>
<div id="msg" class="msg" role="alert"></div>
</form></div>
<div id="done" class="ok" hidden><div class="big">✓</div><h2>¡Registro exitoso!</h2><p class="sub">Pronto te contactarán.</p></div>
<footer>Responsable del tratamiento de datos: Universidad Técnica Particular de Loja (UTPL).</footer>
</div>
<script>
const $=id=>document.getElementById(id);
let CAT={},LIB=[];
fetch('/api/catalogo').then(r=>r.json()).then(j=>{CAT=j.catalogo;LIB=j.libres;Object.keys(CAT).forEach(k=>{const o=document.createElement('option');o.value=o.textContent=k;$('m').appendChild(o)})});
$('m').addEventListener('change',()=>{
  const m=$('m').value,sel=$('c'),cx=$('cx');
  sel.replaceChildren();const base=document.createElement('option');base.value='';
  if(!m){base.textContent='Primero elige la modalidad';sel.append(base);sel.disabled=true;sel.hidden=false;cx.hidden=true;return}
  if(LIB.includes(m)){sel.hidden=true;cx.hidden=false;cx.value='';return}
  cx.hidden=true;sel.hidden=false;sel.disabled=false;base.textContent='Selecciona tu carrera o programa';sel.append(base);
  CAT[m].forEach(x=>{const o=document.createElement('option');o.value=o.textContent=x;sel.append(o)});
});
['d','t'].forEach(id=>$(id).addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,10)));
$('f').addEventListener('submit',async e=>{
  e.preventDefault();const out=$('msg');out.textContent='';
  const modalidad=$('m').value;
  const body={nombre:$('n').value.trim().replace(/\s+/g,' '),cedula:$('d').value,correo:$('e').value.trim(),telefono:$('t').value,modalidad,
    carrera:LIB.includes(modalidad)?$('cx').value.trim():$('c').value,autorizacion:$('a').checked,a:new URLSearchParams(location.search).get('a')||''};
  if(body.nombre.length<3||!body.nombre.includes(' '))return out.textContent='Ingresa nombres y apellidos.';
  if(!/^\d{10}$/.test(body.cedula))return out.textContent='La cédula debe tener 10 dígitos.';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(body.correo))return out.textContent='Ingresa un correo electrónico válido.';
  if(!/^09\d{8}$/.test(body.telefono))return out.textContent='El teléfono debe tener 10 dígitos y empezar con 09.';
  if(!modalidad)return out.textContent='Selecciona la modalidad.';
  if(!body.carrera)return out.textContent='Selecciona o escribe la carrera o programa.';
  if(!body.autorizacion)return out.textContent='Debes autorizar el tratamiento de tus datos.';
  $('b').disabled=true;
  try{
    const r=await fetch('/api/registro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||'Error al registrar.');
    $('form').hidden=true;$('done').hidden=false;
  }catch(err){out.textContent=err.message;$('b').disabled=false}
});
</script></body></html>
